<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trình Trực Quan Hóa Mật Mã</title>
<link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="max-content">
<script src="https://jsdelivr.net" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="max-content"></script>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Bộ chứa chính giới hạn chiều rộng nội dung -->
<div class="container mt-4">
    <!-- Hàng ngang bắt đầu chia không gian -->
    <div class="row g-3">
        
        <!-- Cột bên trái: Trên mobile chiếm trọn 12 phần, trên máy tính chiếm 8 phần -->
        <div class="col-12 col-lg-8">
            <div class="card bg-dark text-white shadow">
                <div class="card-body">
                    <h5 class="card-title">Khu vực trực quan hóa Base64</h5>
                    <p class="card-text">Bảng tra cứu và quy trình chia bit sẽ hiển thị tại đây.</p>
                </div>
            </div>
        </div>
        
        <!-- Cột bên phải: Trên mobile chiếm trọn 12 phần, trên máy tính chiếm 4 phần -->
        <div class="col-12 col-lg-4">
            <div class="card bg-dark text-white shadow">
                <div class="card-body d-flex flex-column gap-2">
                    <h5 class="card-title">Bảng điều khiển</h5>
                    <button class="btn btn-primary">Chạy tiếp (Next)</button>
                    <button class="btn btn-danger">Tạm dừng (Pause)</button>
                </div>
            </div>
        </div>
        
    </div>
</div>

<script src="js/app.js" type="module"></script>
</body>
</html>
